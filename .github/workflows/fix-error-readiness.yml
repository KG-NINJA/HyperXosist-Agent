name: x402 revenue windows evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix-error-readiness.mjs
      - test/fix-error-readiness.test.mjs
      - fix-error-quickstart.json
      - fix-error-response.mjs
      - service-offers.json
      - service-receipts.mjs
      - scripts/services-readiness.mjs
      - test/service-windows.test.mjs
      - test/service-validator-observation.test.mjs
      - .github/workflows/fix-error-readiness.yml
permissions:
  contents: read
concurrency:
  group: fix-error-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline audit and buyer contract tests
        run: node --test test/fix-error-readiness.test.mjs test/fix-error-quickstart.test.mjs test/service-windows.test.mjs test/service-validator-observation.test.mjs
      - name: Collect five-route unpaid evidence (not paid-delivery approval)
        shell: bash
        run: |
          set +e
          node scripts/services-readiness.mjs --live --validate --out audit/revenue-windows.json
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then exit "$code"; fi
          echo "Audit exit=$code. Read route-specific readiness, indexing and metadata gaps; evidence collection is not a paid delivery." >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning::One or more routes are blocked or unknown. Read the evidence; green workflow does not approve payments."
          fi
      - name: Upload privacy-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-windows-evidence
          path: audit/revenue-windows.json
          if-no-files-found: error
          retention-days: 14
