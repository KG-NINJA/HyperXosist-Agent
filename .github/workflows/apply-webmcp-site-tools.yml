name: Apply WebMCP Site Tools Patch

on:
  push:
    branches:
      - codex/webmcp-site-tools

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/webmcp-site-tools
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Apply WebMCP patch
        run: python3 scripts/apply-webmcp-site-tools.py

      - name: Run full test suite
        run: npm test

      - name: Run tool-selection validation
        run: npm run test:tool-selection

      - name: Run quickstart smoke test
        run: npm run quickstart

      - name: Validate diff
        run: git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webmcp.js test/webmcp.test.js index.html package.json README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Add WebMCP Site Tools adapter"
          git push origin HEAD:codex/webmcp-site-tools
