name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} Agent API and MCP validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: npm install

      - name: Run Agent API tests
        run: npm run test:agent

      - name: Check payment metadata against production OpenAPI (read-only)
        timeout-minutes: 2
        run: npm run test:payment-endpoints

      - name: Run access policy, WebMCP and x402 paid execution tests
        run: |
          npm run test:access-policy
          npm run test:paid-execution
          npm run test:webmcp

      - name: Validate optional artifact buyer without payment
        run: |
          npm run test:avu-buyer
          npm run avu:demo
          python3 -m unittest discover -s test -p test_avu_cost_basis.py

      - name: Run local stdio MCP integration tests
        run: npm run test:mcp

      - name: Run shared MCP core and schema tests
        run: npm run test:mcp:core && npm run test:mcp:schema

      - name: Run Remote Streamable HTTP MCP tests
        run: npm run test:mcp:remote

      - name: Run Remote MCP security tests
        run: npm run test:mcp:security

      - name: Run Cloudflare Worker MCP adapter tests
        run: npm run test:mcp:cloudflare

      - name: Evaluate MCP tool selection
        run: npm run test:tool-selection

      - name: Validate OpenAI Remote MCP example without API access
        run: npm run openai:remote-check

      - name: Validate JSON manifests
        run: |
          node -e "
          const fs = require('fs');
          const files = [
            'agent-use.json',
            'agent-tools.json',
            'missions.json',
            'x402-payment.json',
            'access-policy.json',
            '.well-known/mcp.json',
            'mcp-catalog.json',
            'top30_repost_blacklist.json',
            'package.json',
            'examples/agent-session.example.json',
            'test/tool-selection-cases.json',
            'signal-to-fix-pipeline.json'
          ];
          for (const f of files) {
            JSON.parse(fs.readFileSync(f, 'utf8'));
            console.log('OK', f);
          }
          "

      - name: Smoke quickstart
        run: npm run quickstart

      - name: Smoke agent handoff dry-run
        run: npm run agent-handoff-dryrun -- HyperXosist-Agent

      - name: Smoke universal CLI
        run: |
          node bin/hyperxosist.js plan "Find product feedback about CliSmoke" --json --no-pretty | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.missionId) process.exit(1)"
          node bin/hyperxosist.js dispatch hyperxosist_list_missions --args '{}' --json --no-pretty | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.ok) process.exit(1)"
          node bin/hyperxosist.js tools --format anthropic --json --no-pretty | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.tools[0].input_schema) process.exit(1)"

      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > npm-pack.json
          node -e "const p=require('./npm-pack.json')[0]; const files=new Set(p.files.map(x=>x.path)); for (const f of ['agent-api.js','avu-buyer.mjs','avu-buyer.json','docs/AVU_BUYER.md','paid-execution.js','webmcp.js','access-policy.json','mcp/server.js','mcp/remote-server.js','mcp/core.js','mcp/tools.js','docs/MCP.md','docs/CHATGPT_APP.md','agent-use.json','agent-tools.json','missions.json','x402-payment.json','README.md']) { if (!files.has(f)) throw new Error('Missing from npm package: '+f); }"

      - name: Build Remote MCP Docker image
        if: matrix.node-version == '20'
        run: docker build -t hyperxosist-remote-mcp:test .

  cloudflare-worker:
    name: Node 22 Cloudflare Worker MCP validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root MCP dependencies
        run: npm ci

      - name: Install Cloudflare Worker build dependencies
        run: npm --prefix workers/remote-mcp ci

      - name: Run access policy, WebMCP and x402 paid execution tests
        run: |
          npm run test:access-policy
          npm run test:paid-execution
          npm run test:webmcp

      - name: Run Cloudflare Worker MCP adapter tests
        run: npm run test:mcp:cloudflare

      - name: Validate staging Worker bundle without deployment
        run: npm --prefix workers/remote-mcp run check -- --env staging
