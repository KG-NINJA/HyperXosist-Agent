name: Probe live x402 browser boundary

on:
  push:
    branches:
      - codex/webmcp-x402-paid-execution

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CORS preflight and unsigned x402 response
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.kgninja.dev/hyperxosist-query'
          origin='https://kg-ninja.github.io'

          preflight_status=$(curl --silent --show-error --output /tmp/preflight.body --dump-header /tmp/preflight.headers --write-out '%{http_code}' \
            --request OPTIONS "$endpoint" \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,payment-signature')
          echo "Preflight status: $preflight_status"
          sed 's/\r$//' /tmp/preflight.headers
          cat /tmp/preflight.body || true
          case "$preflight_status" in
            200|204) ;;
            *) echo "Unexpected preflight status" >&2; exit 1 ;;
          esac
          tr -d '\r' < /tmp/preflight.headers > /tmp/preflight.clean
          grep -Eiq '^access-control-allow-origin:[[:space:]]*(\*|https://kg-ninja\.github\.io)[[:space:]]*$' /tmp/preflight.clean
          grep -Eiq '^access-control-allow-methods:.*POST' /tmp/preflight.clean
          grep -Eiq '^access-control-allow-headers:.*payment-signature' /tmp/preflight.clean

          post_status=$(curl --silent --show-error --output /tmp/post.body --dump-header /tmp/post.headers --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header "Origin: $origin" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"keywords":"HyperXosist-Agent","mode":"live","noise":{"enabled":true,"preset":"medium"}}')
          echo "Unsigned POST status: $post_status"
          sed 's/\r$//' /tmp/post.headers
          cat /tmp/post.body
          test "$post_status" = '402'
          tr -d '\r' < /tmp/post.headers > /tmp/post.clean
          grep -Eiq '^access-control-allow-origin:[[:space:]]*(\*|https://kg-ninja\.github\.io)[[:space:]]*$' /tmp/post.clean
          grep -Eiq '^payment-required:' /tmp/post.clean
          grep -Eiq '^access-control-expose-headers:.*payment-required' /tmp/post.clean
          grep -Eiq '^access-control-expose-headers:.*payment-response' /tmp/post.clean

          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/post.body','utf8')); if (!body || typeof body !== 'object') process.exit(1); console.log('Unsigned x402 JSON body parsed.');"
